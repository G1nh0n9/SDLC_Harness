[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-harness"
version = "0.1.0"
description = "Evidence-based multi-agent software development workflow harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[project.entry-points."hermes_agent.plugins"]
agent-workflow-harness = "agent_harness.hermes_plugin"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "markdown>=3.8,<4",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_harness = ["schemas/*.json", "plugin_skill/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_harness"]
